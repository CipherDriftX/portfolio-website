<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="thumb-outreach-os" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums lining-nums"><title id="thumb-outreach-os">Three steps. Outreach OS reads posts on Reddit, Hacker News, X, Stack Exchange, Upwork, GitHub and Bluesky and finds someone asking for help. It researches the lead: company, contact, pains, tech stack and competitors, each fact graded, the weak one left out. Then it fills your own email template with the graded facts only.</title><rect width="1200" height="520" fill="#211413"/><text x="48" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">1</tspan><tspan dx="12">Spots a buyer</tspan></text><text x="430" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">2</tspan><tspan dx="12">Researches the lead</tspan></text><text x="822" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">3</tspan><tspan dx="12">Fills your template</tspan></text><rect x="48" y="98" width="330" height="46" fill="#2e1d1a"/><text x="64" y="118" font-size="15" fill="#a38f7d">Reddit</text><rect x="64" y="128" width="212.3" height="5" fill="#5c463b"/><rect x="48" y="152" width="330" height="46" fill="#2e1d1a"/><text x="64" y="172" font-size="15" fill="#a38f7d">Hacker News</text><rect x="64" y="182" width="224.2" height="5" fill="#5c463b"/><rect x="48" y="206" width="330" height="46" fill="#2e1d1a"/><text x="64" y="226" font-size="15" fill="#a38f7d">X</text><rect x="64" y="236" width="229.5" height="5" fill="#5c463b"/><rect x="48" y="260" width="330" height="46" fill="#2e1d1a"/><text x="64" y="280" font-size="15" fill="#a38f7d">Stack Exchange</text><rect x="64" y="290" width="244.2" height="5" fill="#5c463b"/><rect x="48" y="314" width="330" height="46" fill="#2e1d1a"/><rect x="48" y="314" width="4" height="46" fill="#cf9a63"/><text x="64" y="334" font-size="15" fill="#f6e9ce" font-weight="600">Upwork</text><rect x="64" y="344" width="224" height="5" fill="#a38f7d"/><text x="364" y="334" font-size="15" fill="#cf9a63" text-anchor="end" font-weight="600">asks for help</text><rect x="48" y="368" width="330" height="46" fill="#2e1d1a"/><text x="64" y="388" font-size="15" fill="#a38f7d">GitHub</text><rect x="64" y="398" width="242.2" height="5" fill="#5c463b"/><rect x="48" y="422" width="330" height="46" fill="#2e1d1a"/><text x="64" y="442" font-size="15" fill="#a38f7d">Bluesky</text><rect x="64" y="452" width="152.9" height="5" fill="#5c463b"/><path d="M378 337 C404 337 398 290 424 290" fill="none" stroke="#cf9a63" stroke-width="2"/><rect x="430" y="98" width="334" height="382" fill="#2e1d1a"/><circle cx="464" cy="136" r="16" fill="#a38f7d"/><rect x="490" y="126" width="124" height="9" fill="#f6e9ce"/><rect x="490" y="142" width="80" height="6" fill="#5c463b"/><text x="452" y="202" font-size="17" fill="#a38f7d">Company</text><rect x="452" y="214" width="162.6" height="6" fill="#5c463b"/><rect x="698" y="190" width="11" height="11" fill="#cf9a63"/><rect x="714" y="190" width="11" height="11" fill="#cf9a63"/><rect x="730" y="190" width="11" height="11" fill="#cf9a63"/><text x="452" y="254" font-size="17" fill="#a38f7d">Contact</text><rect x="452" y="266" width="196" height="6" fill="#5c463b"/><rect x="698" y="242" width="11" height="11" fill="#cf9a63"/><rect x="714" y="242" width="11" height="11" fill="#cf9a63"/><rect x="730" y="242" width="11" height="11" fill="#cf9a63"/><text x="452" y="306" font-size="17" fill="#a38f7d">Pains</text><rect x="452" y="318" width="175.4" height="6" fill="#5c463b"/><rect x="698" y="294" width="11" height="11" fill="#cf9a63"/><rect x="714" y="294" width="11" height="11" fill="#cf9a63"/><rect x="730.75" y="294.75" width="9.5" height="9.5" fill="none" stroke="#5c463b" stroke-width="1.5"/><text x="452" y="358" font-size="17" fill="#a38f7d">Tech stack</text><rect x="452" y="370" width="193.1" height="6" fill="#5c463b"/><rect x="698" y="346" width="11" height="11" fill="#cf9a63"/><rect x="714" y="346" width="11" height="11" fill="#cf9a63"/><rect x="730" y="346" width="11" height="11" fill="#cf9a63"/><text x="452" y="410" font-size="17" fill="#5c463b">Competitors</text><rect x="452" y="422" width="137.9" height="6" fill="#432d26"/><rect x="698.75" y="398.75" width="9.5" height="9.5" fill="none" stroke="#5c463b" stroke-width="1.5"/><rect x="714.75" y="398.75" width="9.5" height="9.5" fill="none" stroke="#5c463b" stroke-width="1.5"/><rect x="730.75" y="398.75" width="9.5" height="9.5" fill="none" stroke="#5c463b" stroke-width="1.5"/><line x1="446" y1="405" x2="590" y2="405" stroke="#a38f7d" stroke-width="1.5"/><text x="742" y="428" font-size="14" fill="#a38f7d" text-anchor="end">weak, left out</text><text x="452" y="458" font-size="14" fill="#a38f7d" class="minor">each fact graded, with its source</text><line x1="770" y1="290" x2="816" y2="290" stroke="#5c463b" stroke-width="2"/><path d="M807 284 L816 290 L807 296" fill="none" stroke="#5c463b" stroke-width="2"/><rect x="822" y="98" width="330" height="382" fill="#2e1d1a"/><text x="844" y="138" font-size="16" fill="#f6e9ce"><tspan fill="#cf9a63" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14">[contact_first_name]</tspan>,</text><text x="844" y="194" font-size="16" fill="#a38f7d">I came across your</text><text x="844" y="222" font-size="16" fill="#a38f7d"><tspan fill="#cf9a63" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14">(signal_source_type)</tspan> on</text><text x="844" y="250" font-size="16" fill="#a38f7d"><tspan fill="#cf9a63" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14">(signal_source_name)</tspan>…</text><text x="844" y="306" font-size="16" fill="#a38f7d">…<tspan fill="#cf9a63" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14">[pain_summary]</tspan> is the</text><text x="844" y="334" font-size="16" fill="#a38f7d">kind of work we handle.</text><text x="844" y="362" font-size="16" fill="#a38f7d">We integrate with</text><text x="844" y="390" font-size="16" fill="#a38f7d"><tspan fill="#cf9a63" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14">[tech_stack_primary_tools]</tspan>.</text><text x="844" y="418" font-size="14" fill="#5c463b" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">switch from [competitor_name]</text><line x1="840" y1="413" x2="1092" y2="413" stroke="#a38f7d" stroke-width="1.5"/><text x="844" y="446" font-size="16" fill="#a38f7d">Worth ten minutes this week?</text><text x="822" y="508" font-size="15" fill="#a38f7d" class="minor">No AI writes the email.</text></svg>
