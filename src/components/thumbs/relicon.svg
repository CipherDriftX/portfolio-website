<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="thumb-relicon" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums lining-nums"><title id="thumb-relicon">Three steps. You write one sentence about your product. Relicon plans a hook, problem and solution scene. You get a finished video ad in four sizes, 9:16, 1:1, 4:5 and 16:9, with captions inside each safe zone.</title><rect width="1200" height="520" fill="#211413"/><text x="48" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">1</tspan><tspan dx="12">You write a line</tspan></text><text x="372" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">2</tspan><tspan dx="12">It plans scenes</tspan></text><text x="722" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">3</tspan><tspan dx="12">A finished ad, 4 sizes</tspan></text><rect x="48" y="170" width="284" height="152" fill="#2e1d1a"/><text x="70" y="216" font-size="27" fill="#f6e9ce">One sentence</text><text x="70" y="252" font-size="27" fill="#f6e9ce">about your</text><text x="70" y="288" font-size="27" fill="#f6e9ce">product.</text><rect x="176" y="266" width="3" height="28" fill="#cf9a63"/><line x1="338" y1="246" x2="366" y2="246" stroke="#5c463b" stroke-width="2"/><path d="M357 240 L366 246 L357 252" fill="none" stroke="#5c463b" stroke-width="2"/><rect x="372" y="164" width="92" height="164" fill="#2e1d1a"/><rect x="386" y="208" width="64" height="11" fill="#f6e9ce"/><rect x="386" y="225" width="48" height="11" fill="#f6e9ce"/><rect x="386" y="252" width="34" height="5" fill="#a38f7d"/><text x="418" y="360" font-size="18" fill="#a38f7d" text-anchor="middle">Hook</text><rect x="476" y="164" width="92" height="164" fill="#2e1d1a"/><line x1="486" y1="274" x2="558" y2="274" stroke="#5c463b" stroke-width="2"/><circle cx="522.0" cy="224" r="10" fill="#a38f7d"/><path d="M506.0 274 Q522.0 230 538.0 274" fill="#a38f7d"/><text x="522" y="360" font-size="18" fill="#a38f7d" text-anchor="middle">Problem</text><rect x="580" y="164" width="92" height="164" fill="#2e1d1a"/><circle cx="626.0" cy="232" r="23" fill="#cf9a63"/><rect x="598" y="280" width="56" height="16" fill="none" stroke="#f6e9ce" stroke-width="2"/><text x="626" y="360" font-size="18" fill="#a38f7d" text-anchor="middle">Solution</text><line x1="686" y1="246" x2="714" y2="246" stroke="#5c463b" stroke-width="2"/><path d="M705 240 L714 246 L705 252" fill="none" stroke="#5c463b" stroke-width="2"/><rect x="724" y="182" width="72" height="128" fill="#2e1d1a"/><path d="M751.9 224.2 L771.5 235.8 L751.9 247.3 Z" fill="#cf9a63"/><rect x="731.2" y="194.8" width="57.6" height="102.4" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="739.8" y="285.2" width="40.3" height="5" fill="#f6e9ce"/><rect x="724" y="307" width="72" height="3" fill="#5c463b"/><rect x="724" y="307" width="27.4" height="3" fill="#cf9a63"/><text x="760" y="342" font-size="18" fill="#a38f7d" text-anchor="middle">9:16</text><rect x="808" y="238" width="72" height="72" fill="#2e1d1a"/><path d="M835.9 256.7 L855.5 268.2 L835.9 279.8 Z" fill="#cf9a63"/><rect x="815.2" y="245.2" width="57.6" height="57.6" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="823.8" y="290.8" width="40.3" height="5" fill="#f6e9ce"/><rect x="808" y="307" width="72" height="3" fill="#5c463b"/><rect x="808" y="307" width="27.4" height="3" fill="#cf9a63"/><text x="844" y="342" font-size="18" fill="#a38f7d" text-anchor="middle">1:1</text><rect x="892" y="220" width="72" height="90" fill="#2e1d1a"/><path d="M919.9 246.3 L939.5 257.8 L919.9 269.3 Z" fill="#cf9a63"/><rect x="899.2" y="229" width="57.6" height="72" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="907.8" y="289" width="40.3" height="5" fill="#f6e9ce"/><rect x="892" y="307" width="