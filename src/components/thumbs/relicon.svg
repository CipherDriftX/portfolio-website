<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="thumb-relicon" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums lining-nums"><title id="thumb-relicon">Four steps in a loop. You write one sentence about your product. Relicon plans a hook, problem and solution scene. You get a finished video ad in four sizes, 9:16, 1:1, 4:5 and 16:9. Then it reads how the ads did and uses the results to plan the next batch.</title><rect width="1200" height="520" fill="#211413"/><text x="48" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">1</tspan><tspan dx="12">You write a line</tspan></text><text x="372" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">2</tspan><tspan dx="12">It plans scenes</tspan></text><text x="722" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">3</tspan><tspan dx="12">A finished ad, 4 sizes</tspan></text><rect x="48" y="150" width="284" height="152" fill="#2e1d1a"/><text x="70" y="196" font-size="27" fill="#f6e9ce">One sentence</text><text x="70" y="232" font-size="27" fill="#f6e9ce">about your</text><text x="70" y="268" font-size="27" fill="#f6e9ce">product.</text><rect x="176" y="246" width="3" height="28" fill="#cf9a63"/><line x1="338" y1="226" x2="366" y2="226" stroke="#5c463b" stroke-width="2"/><path d="M357 220 L366 226 L357 232" fill="none" stroke="#5c463b" stroke-width="2"/><rect x="372" y="144" width="92" height="164" fill="#2e1d1a"/><rect x="386" y="188" width="64" height="11" fill="#f6e9ce"/><rect x="386" y="205" width="48" height="11" fill="#f6e9ce"/><rect x="386" y="232" width="34" height="5" fill="#a38f7d"/><text x="418" y="340" font-size="18" fill="#a38f7d" text-anchor="middle">Hook</text><rect x="476" y="144" width="92" height="164" fill="#2e1d1a"/><line x1="486" y1="254" x2="558" y2="254" stroke="#5c463b" stroke-width="2"/><circle cx="522.0" cy="204" r="10" fill="#a38f7d"/><path d="M506.0 254 Q522.0 210 538.0 254" fill="#a38f7d"/><text x="522" y="340" font-size="18" fill="#a38f7d" text-anchor="middle">Problem</text><rect x="580" y="144" width="92" height="164" fill="#2e1d1a"/><circle cx="626.0" cy="212" r="23" fill="#cf9a63"/><rect x="598" y="260" width="56" height="16" fill="none" stroke="#f6e9ce" stroke-width="2"/><text x="626" y="340" font-size="18" fill="#a38f7d" text-anchor="middle">Solution</text><line x1="686" y1="226" x2="714" y2="226" stroke="#5c463b" stroke-width="2"/><path d="M705 220 L714 226 L705 232" fill="none" stroke="#5c463b" stroke-width="2"/><rect x="724" y="162" width="72" height="128" fill="#2e1d1a"/><path d="M751.9 204.2 L771.5 215.8 L751.9 227.3 Z" fill="#cf9a63"/><rect x="731.2" y="174.8" width="57.6" height="102.4" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="739.8" y="265.2" width="40.3" height="5" fill="#f6e9ce"/><rect x="724" y="287" width="72" height="3" fill="#5c463b"/><rect x="724" y="287" width="27.4" height="3" fill="#cf9a63"/><text x="760" y="322" font-size="18" fill="#a38f7d" text-anchor="middle">9:16</text><rect x="808" y="218" width="72" height="72" fill="#2e1d1a"/><path d="M835.9 236.7 L855.5 248.2 L835.9 259.8 Z" fill="#cf9a63"/><rect x="815.2" y="225.2" width="57.6" height="57.6" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="823.8" y="270.8" width="40.3" height="5" fill="#f6e9ce"/><rect x="808" y="287" width="72" height="3" fill="#5c463b"/><rect x="808" y="287" width="27.4" height="3" fill="#cf9a63"/><text x="844" y="322" font-size="18" fill="#a38f7d" text-anchor="middle">1:1</text><rect x="892" y="200" width="72" height="90" fill="#2e1d1a"/><path d="M919.9 226.3 L939.5 237.8 L919.9 249.3 Z" fill="#cf9a63"/><rect x="899.2" y="209" width="57.6" height="72" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="907.8" y="269" width="40.3" height="5" fill="#f6e9ce"/><rect x="892" y="287" width="72" height="3" fill="#5c463b"/><rect x="892" y="287" width="27.4" height="3" fill="#cf9a63"/><text x="928" y="322" font-size="18" fill="#a38f7d" text-anchor="middle">4:5</text><rect x="976" y="218" width="128" height="72" fill="#2e1d1a"/><path d="M1031.9 236.7 L1051.5 248.2 L1031.9 259.8 Z" fill="#cf9a63"/><rect x="988.8" y="225.2" width="102.4" height="57.6" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="1004.2" y="270.8" width="71.7" height="5" fill="#f6e9ce"/><rect x="976" y="287" width="128" height="3" fill="#5c463b"/><rect x="976" y="287" width="48.6" height="3" fill="#cf9a63"/><text x="1040" y="322" font-size="18" fill="#a38f7d" text-anchor="middle">16:9</text><path d="M940 332 V394 H526 V358" fill="none" stroke="#cf9a63" stroke-width="2.5"/><path d="M519 368 L526 356 L533 368" fill="none" stroke="#cf9a63" stroke-width="2.5"/><text x="560" y="432" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">4</tspan><tspan dx="12">It learns from the results</tspan></text><text x="560" y="462" font-size="16" fill="#a38f7d" class="minor">hook rate, clicks and return on spend steer the next batch</text></svg>
