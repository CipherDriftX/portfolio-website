<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="thumb-relicon" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums lining-nums"><title id="thumb-relicon">One sentence about a product turns into a three-frame storyboard, hook, problem and solution, and then into four finished ads at 9:16, 1:1, 4:5 and 16:9, captions kept inside each safe zone.</title><rect width="1200" height="520" fill="#211413"/><text x="64" y="196" font-size="41" fill="#f6e9ce" text-anchor="start">“One sentence</text><text x="64" y="246" font-size="41" fill="#f6e9ce" text-anchor="start">about your</text><text x="64" y="296" font-size="41" fill="#f6e9ce" text-anchor="start">product.”</text><rect x="64" y="322" width="52" height="3" fill="#cf9a63"/><line x1="316" y1="238" x2="346" y2="238" stroke="#5c463b" stroke-width="2"/><path d="M337 232 L346 238 L337 244" fill="none" stroke="#5c463b" stroke-width="2"/><rect x="362" y="151" width="98" height="174" fill="#2c1c1a"/><rect x="376" y="197" width="64" height="11" fill="#f6e9ce"/><rect x="376" y="214" width="48" height="11" fill="#f6e9ce"/><rect x="376" y="241" width="34" height="5" fill="#a38f7d"/><text x="411" y="359" font-size="20" fill="#a38f7d" text-anchor="middle" class="minor">Hook</text><rect x="474" y="151" width="98" height="174" fill="#2c1c1a"/><line x1="484" y1="263" x2="562" y2="263" stroke="#5c463b" stroke-width="2"/><circle cx="523.0" cy="213" r="10" fill="#a38f7d"/><path d="M507.0 263 Q523.0 219 539.0 263" fill="#a38f7d"/><text x="523" y="359" font-size="20" fill="#a38f7d" text-anchor="middle" class="minor">Problem</text><rect x="586" y="151" width="98" height="174" fill="#2c1c1a"/><circle cx="635.0" cy="221" r="23" fill="#cf9a63"/><rect x="604" y="269" width="56" height="16" fill="none" stroke="#f6e9ce" stroke-width="2"/><text x="635" y="359" font-size="20" fill="#a38f7d" text-anchor="middle" class="minor">Solution</text><line x1="698" y1="238" x2="724" y2="238" stroke="#5c463b" stroke-width="2"/><path d="M715 232 L724 238 L715 244" fill="none" stroke="#5c463b" stroke-width="2"/><rect x="738" y="175.8" width="80" height="142.2" fill="#2c1c1a"/><circle cx="778" cy="235.5" r="16" fill="#cf9a63"/><rect x="746" y="190" width="64" height="113.8" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="755.6" y="291.8" width="44.8" height="5" fill="#f6e9ce"/><text x="778" y="352" font-size="20" fill="#a38f7d" text-anchor="middle" class="key">9:16</text><rect x="830" y="238" width="80" height="80" fill="#2c1c1a"/><circle cx="870" cy="271.6" r="16" fill="#cf9a63"/><rect x="838" y="246" width="64" height="64" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="847.6" y="298" width="44.8" height="5" fill="#f6e9ce"/><text x="870" y="352" font-size="20" fill="#a38f7d" text-anchor="middle" class="key">1:1</text><rect x="922" y="218" width="80" height="100" fill="#2c1c1a"/><circle cx="962" cy="260" r="16" fill="#cf9a63"/><rect x="930" y="228" width="64" height="80" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="939.6" y="296" width="44.8" height="5" fill="#f6e9ce"/><text x="962" y="352" font-size="20" fill="#a38f7d" text-anchor="middle" class="key">4:5</text><rect x="1014" y="238" width="142.2" height="80" fill="#2c1c1a"/><circle cx="1085.1" cy="271.6" r="16" fill="#cf9a63"/><rect x="1028.2" y="246" width="113.8" height="64" fill="none" stroke="#5c463b" stroke-width="1.25" stroke-dasharray="3 3"/><rect x="1045.3" y="298" width="79.6" height="5" fill="#f6e9ce"/><text x="1085.1" y="352" font-size="20" fill="#a38f7d" text-anchor="middle" class="key">16:9</text><text x="64" y="474" font-size="24" fill="#f6e9ce" text-anchor="start" font-weight="600" class="key">One sentence in</text><text x="1136" y="474" font-size="24" fill="#f6e9ce" text-anchor="end" font-weight="600" class="key">A finished ad out, in 4 formats</text></svg>
