<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="thumb-prompt-injection-database" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums lining-nums"><title id="thumb-prompt-injection-database">Two steps. A wall of 82 real prompt injection attacks, such as The Trojan PDF, The Sleeper Cell and Grandma&#x27;s Lullaby, in seven families. One record, The Invisible Ink, is open: indirect injection, arrives in web content, targets the RAG retriever, high stealth, medium difficulty.</title><rect width="1200" height="520" fill="#211413"/><text x="48" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">1</tspan><tspan dx="12">82 known attacks</tspan></text><text x="770" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">2</tspan><tspan dx="12">Each one labelled</tspan></text><rect x="48" y="98" width="206" height="80" fill="#2e1d1a"/><text x="64" y="132" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Trojan PDF</text><text x="64" y="158" font-size="13" fill="#5c463b">Indirect injection</text><rect x="268" y="98" width="206" height="80" fill="#2e1d1a"/><text x="284" y="132" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Boiling Frog</text><text x="284" y="158" font-size="13" fill="#5c463b">Logic exploit</text><rect x="488" y="98" width="206" height="80" fill="#2e1d1a"/><text x="504" y="132" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Sleeper Cell</text><text x="504" y="158" font-size="13" fill="#5c463b">Indirect injection</text><rect x="48" y="190" width="206" height="80" fill="#2e1d1a"/><text x="64" y="224" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Long Con</text><text x="64" y="250" font-size="13" fill="#5c463b">Emotional leverage</text><rect x="268" y="190" width="206" height="80" fill="#2e1d1a"/><text x="284" y="224" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Decoder Ring</text><text x="284" y="250" font-size="13" fill="#5c463b">Obfuscation</text><rect x="488" y="190" width="206" height="80" fill="#2e1d1a"/><rect x="489" y="191" width="204" height="78" fill="none" stroke="#cf9a63" stroke-width="2"/><text x="504" y="224" font-size="19" fill="#f6e9ce" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Invisible Ink</text><text x="504" y="250" font-size="13" fill="#cf9a63">Indirect injection</text><rect x="48" y="282" width="206" height="80" fill="#2e1d1a"/><text x="64" y="316" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">Grandma&#x27;s Lullaby</text><text x="64" y="342" font-size="13" fill="#5c463b">Emotional leverage</text><rect x="268" y="282" width="206" height="80" fill="#2e1d1a"/><text x="284" y="316" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Impersonator</text><text x="284" y="342" font-size="13" fill="#5c463b">Authority hijacking</text><rect x="488" y="282" width="206" height="80" fill="#2e1d1a"/><text x="504" y="316" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Schema Trap</text><text x="504" y="342" font-size="13" fill="#5c463b">Information extraction</text><rect x="48" y="374" width="206" height="80" fill="#2e1d1a"/><text x="64" y="408" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Comment Worm</text><text x="64" y="434" font-size="13" fill="#5c463b">Logic exploit</text><rect x="268" y="374" width="206" height="80" fill="#2e1d1a"/><text x="284" y="408" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Time Capsule</text><text x="284" y="434" font-size="13" fill="#5c463b">Context manipulation</text><rect x="488" y="374" width="206" height="80" fill="#2e1d1a"/><text x="504" y="408" font-size="19" fill="#a38f7d" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Relay Bomb</text><text x="504" y="434" font-size="13" fill="#5c463b">Indirect injection</text><text x="48" y="494" font-size="15" fill="#a38f7d" class="minor">12 of the 82, in 7 families</text><line x1="694" y1="230" x2="770" y2="230" stroke="#cf9a63" stroke-width="2"/><rect x="770" y="98" width="382" height="356" fill="#2e1d1a"/><rect x="770" y="98" width="382" height="4" fill="#cf9a63"/><text x="798" y="160" font-size="34" fill="#f6e9ce" font-family="Gloock, 'Iowan Old Style', Georgia, serif">The Invisible Ink</text><text x="798" y="190" font-size="14" fill="#5c463b" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">7.2-002</text><text x="798" y="246" font-size="16" fill="#a38f7d">Family</text><text x="920" y="246" font-size="18" fill="#f6e9ce">Indirect injection</text><text x="798" y="286" font-size="16" fill="#a38f7d">Arrives in</text><text x="920" y="286" font-size="18" fill="#f6e9ce">web content</text><text x="798" y="326" font-size="16" fill="#a38f7d">Targets</text><text x="920" y="326" font-size="18" fill="#f6e9ce">RAG retriever</text><text x="798" y="366" font-size="16" fill="#a38f7d">Stealth</text><text x="920" y="366" font-size="18" fill="#cf9a63" font-weight="600">high</text><text x="798" y="406" font-size="16" fill="#a38f7d">Difficulty</text><text x="920" y="406" font-size="18" fill="#f6e9ce">medium</text><text x="770" y="494" font-size="15" fill="#a38f7d" class="minor">ready to run against your agent</text></svg>
