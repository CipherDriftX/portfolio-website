<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="thumb-wyatt" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums lining-nums"><title id="thumb-wyatt">Three steps. An AI agent tries calls such as path traversal, a symlink swapped in mid-read, SSRF to the cloud metadata address or sending a secret out. Wyatt checks each one before it runs, and each attack is stopped by its policy, the kernel, the tool driver, the agent&#x27;s identity or the kill switch. A file read that holds a key is allowed with the key cut out.</title><rect width="1200" height="520" fill="#211413"/><text x="48" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">1</tspan><tspan dx="12">An agent tries</tspan></text><text x="440" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">2</tspan><tspan dx="12">Wyatt checks it</tspan></text><text x="842" y="62" font-size="25" font-weight="600" fill="#f6e9ce" class="key"><tspan fill="#cf9a63">3</tspan><tspan dx="12">Only safe calls run</tspan></text><rect x="470" y="92" width="118" height="384" fill="#2e1d1a"/><line x1="485" y1="104" x2="485" y2="464" stroke="#432d26" stroke-width="3"/><line x1="507" y1="104" x2="507" y2="464" stroke="#432d26" stroke-width="3"/><line x1="529" y1="104" x2="529" y2="464" stroke="#432d26" stroke-width="3"/><line x1="551" y1="104" x2="551" y2="464" stroke="#432d26" stroke-width="3"/><line x1="573" y1="104" x2="573" y2="464" stroke="#432d26" stroke-width="3"/><text x="48" y="126" font-size="18" fill="#f6e9ce">read a file that holds a key</text><line x1="297.2" y1="120" x2="470" y2="120" stroke="#a38f7d" stroke-width="2"/><line x1="470" y1="120" x2="1004" y2="120" stroke="#f6e9ce" stroke-width="2"/><rect x="700" y="113" width="70" height="14" fill="#cf9a63"/><text x="1016" y="126" font-size="17" fill="#f6e9ce" font-weight="600">allowed,</text><text x="1016" y="147" font-size="15" fill="#a38f7d">key cut out</text><text x="48" y="172" font-size="18" fill="#f6e9ce">path traversal with ..</text><line x1="246.8" y1="166" x2="470" y2="166" stroke="#a38f7d" stroke-width="2"/><line x1="470" y1="166" x2="507" y2="166" stroke="#a38f7d" stroke-width="2"/><rect x="504" y="153" width="6" height="26" fill="#cf9a63"/><text x="606" y="172" font-size="17" fill="#cf9a63" font-weight="600">stopped · policy</text><text x="48" y="218" font-size="18" fill="#f6e9ce">symlink swapped in mid-read</text><line x1="288.8" y1="212" x2="470" y2="212" stroke="#a38f7d" stroke-width="2"/><line x1="470" y1="212" x2="529" y2="212" stroke="#a38f7d" stroke-width="2"/><rect x="526" y="199" width="6" height="26" fill="#cf9a63"/><text x="606" y="218" font-size="17" fill="#cf9a63" font-weight="600">stopped · kernel</text><text x="48" y="264" font-size="18" fill="#f6e9ce">shell injection in arguments</text><line x1="297.2" y1="258" x2="470" y2="258" stroke="#a38f7d" stroke-width="2"/><line x1="470" y1="258" x2="551" y2="258" stroke="#a38f7d" stroke-width="2"/><rect x="548" y="245" width="6" height="26" fill="#cf9a63"/><text x="606" y="264" font-size="17" fill="#cf9a63" font-weight="600">stopped · driver</text><text x="48" y="310" font-size="18" fill="#f6e9ce">read a secret, then send it out</text><line x1="322.4" y1="304" x2="470" y2="304" stroke="#a38f7d" stroke-width="2"/><line x1="470" y1="304" x2="507" y2="304" stroke="#a38f7d" stroke-width="2"/><rect x="504" y="291" width="6" height="26" fill="#cf9a63"/><text x="606" y="310" font-size="17" fill="#cf9a63" font-weight="600">stopped · policy</text><text x="48" y="356" font-size="18" fill="#f6e9ce">SSRF to the cloud metadata address</text><line x1="347.6" y1="350" x2="470" y2="350" stroke="#a38f7d" stroke-width="2"/><line x1="470" y1="350" x2="551" y2="350" stroke="#a38f7d" stroke-width="2"/><rect x="548" y="337" width="6" height="26" fill="#cf9a63"/><text x="606" y="356" font-size="17" fill="#cf9a63" font-we