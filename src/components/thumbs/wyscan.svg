t="6" fill="#5c463b"/><rect x="420" y="100" width="340" height="380" fill="#2e1d1a"/><text x="440" y="130" font-size="15" fill="#a38f7d" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">helpers/files.py</text><line x1="420" y1="146" x2="760" y2="146" stroke="#432d26" stroke-width="2"/><rect x="444" y="173" width="182.1" height="6" fill="#5c463b"/><text x="444" y="232" font-size="16" fill="#f6e9ce" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">def delete_workspace(...):</text><rect x="464" y="251" width="118.5" height="6" fill="#5c463b"/><text x="464" y="284" font-size="16" fill="#cf9a63" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">shutil.rmtree(...)</text><rect x="444" y="329" width="115.8" height="6" fill="#5c463b"/><rect x="464" y="355" width="199.5" height="6" fill="#5c463b"/><rect x="464" y="381" width="141.7" height="6" fill="#5c463b"/><rect x="444" y="433" width="182" height="6" fill="#5c463b"/><rect x="464" y="459" width="142.4" height="6" fill="#5c463b"/><circle cx="60" cy="253" r="5" fill="#cf9a63"/><path d="M60 253 V357 H86 M299.6 357 H404 V227 H440 M432 227 V279 H458" fill="none" stroke="#cf9a63" stroke-width="2.5"/><rect x="644.8" y="273" width="12" height="12" fill="#cf9a63"/><line x1="656.8" y1="279" x2="800" y2="279" stroke="#cf9a63" stroke-width="2"/><rect x="800" y="172" width="352" height="214" fill="#2e1d1a"/><rect x="800" y="172" width="4" height="214" fill="#cf9a63"/><text x="828" y="216" font-size="18" fill="#cf9a63" font-weight="600">CRITICAL</text><text x="828" y="262" font-size="27" fill="#f6e9ce">An agent tool can</text><text x="828" y="296" font-size="27" fill="#f6e9ce">delete files.</text><text x="828" y="336" font-size="17" fill="#a38f7d">No permission check on the way.</text><text x="828" y="364" font-size="13" fill="#a38f7d" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tools/setup.py → helpers/files.py</text><text x="800" y="508" font-size="15" fill="#a38f7