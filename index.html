<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aryan Haghighi, AI Engineer</title>
<meta name="description" content="I ship LLM features into production and prove they work.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://aryanhaghighi.com/">
<link rel="preload" href="fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk-var.woff2") format("woff2");
  font-weight: 400 600;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #fafaf9;
  --ink: #141414;
  --muted: #64645f;
  --accent: #e64600;
  --gutter: clamp(1rem, 5vw - 0.5rem, 6rem);
  --display: clamp(2.25rem, 1rem + 5vw, 5rem);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f0f;
    --ink: #ececea;
    --muted: #9c9c98;
    --accent: #ff4f00;
  }
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 100vh;
  min-height: 100svh;
  width: min(100% - 2 * var(--gutter), 72rem);
  margin-inline: auto;
  padding-block: clamp(2rem, 6vh, 4rem) clamp(3rem, 12vh, 7rem);
}
h1, hgroup p {
  margin: 0;
  font-size: var(--display);
  font-weight: 600;
  line-height: 1.04;
  letter-spacing: -0.03em;
}
hgroup p { color: var(--muted); }
.claim {
  margin: clamp(1.75rem, 1rem + 2vw, 3rem) 0 0;
  max-width: 36rem;
  font-size: clamp(1.125rem, 1rem + 0.55vw, 1.5rem);
  line-height: 1.35;
  text-wrap: balance;
}
.aside { margin: 0.75rem 0 0; color: var(--muted); }
nav { margin-top: clamp(2rem, 1.25rem + 2vw, 3rem); }
ul { display: flex; flex-wrap: wrap; gap: 0.25rem 1.75rem; margin: 0; padding: 0; list-style: none; }
nav a {
  display: inline-block;
  padding-block: 0.375rem;
  color: inherit;
  font-size: 1.0625rem;
  overflow-wrap: anywhere;
  text-decoration: underline var(--accent);
  text-decoration-thickness: 0.09em;
  text-underline-offset: 0.3em;
}
nav a:hover { text-decoration-thickness: 0.18em; }
nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
::selection { background: var(--ink); color: var(--bg); }
@media (max-width: 30rem) {
  ul { flex-direction: column; gap: 0; }
  nav a { padding-block: 0.5rem; }
}
</style>
</head>
<body>
<main>
  <hgroup>
    <h1>Aryan Haghighi</h1>
    <p>AI Engineer</p>
  </hgroup>
  <p class="claim">I ship LLM features into production and prove they work.</p>
  <p class="aside">Building autonomous drones.</p>
  <nav aria-label="Contact">
    <ul>
      <li><a href="mailto:aryan@aryanhaghighi.com">aryan@aryanhaghighi.com</a></li>
      <li><a href="https://www.linkedin.com/in/aryan-haghighi-24b779304/" rel="me">LinkedIn</a></li>
      <li><a href="https://github.com/CipherDriftX" rel="me">GitHub</a></li>
    </ul>
  </nav>
</main>
</body>
</html>
