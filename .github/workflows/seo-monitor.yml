# Checks the live site as search engines and AI crawlers see it: every page
# in the sitemap, the structured data, the files for machines, the crawlers'
# access, and Lighthouse on mobile and desktop.
#
# Runs after each production deploy of main (a failure emails the owner) and
# every Monday, when it also posts the report to the "SEO monitor" issue so
# the history stays in one place.
name: SEO monitor

on:
  status:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    # Same rule as indexnow.yml: only the production deploy of main's head.
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Vercel' &&
       github.event.state == 'success' &&
       github.event.sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      # Mobile three times: runner speed swings the score by about 10
      # points, so the check reports the median run.
      - name: Lighthouse, mobile x3 and desktop
        continue-on-error: true
        run: |
          flags="--quiet --only-categories=performance,accessibility,best-practices,seo --chrome-flags=--headless=new"
          for i in 1 2 3; do
            npx -y lighthouse@13.6.0 https://www.aryanhaghighi.com/ $flags --output=json --output-path=lh-mobile-$i.json
          done
          npx -y lighthouse@13.6.0 https://www.aryanhaghighi.com/ $flags --preset=desktop --output=json --output-path=lh-desktop.json

      - name: Check the live site
        run: node scripts/seo-check.mjs --lighthouse "$(ls lh-*.json | paste -sd,)" --out report.md

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-${{ github.run_id }}
          path: lh-*.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Post the weekly report
        if: always() && github.event_name != 'status' && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --state open --search '"SEO monitor" in:title' --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            issue=$(gh issue create --title "SEO monitor" --body "Weekly report from .github/workflows/seo-monitor.yml. Each comment is one run." | grep -o '[0-9]*$')
          fi
          gh issue comment "$issue" --body-file report.md
